name: pets-edge
services:
  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a reviewed caddy:2 image digest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FMN_HOST: ${FMN_HOST:?Set FMN_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - fmn-edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  fmn-edge:
    external: true
volumes:
  caddy_data:
  caddy_config:
